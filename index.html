<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>about_me.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== EDIT YOUR COLOURS HERE ===== */
  :root{
    --desktop:#060409; --dots:#24102e;
    --window:#1a1220; --panel:#0b0710;
    --titlebar:#4a1a63; --accent:#e58ad6;
    --light:#5c3f6e; --dark:#000000; --line:#45305a;
    --text:#ece0ef; --muted:#c4b2cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background-color:var(--desktop);
    background-image:radial-gradient(var(--dots) 1px,transparent 1px);
    background-size:5px 5px;
    font-family:'VT323',monospace;color:var(--text);
    display:flex;flex-direction:column;min-height:100vh;
  }
  .desktop{flex:1;position:relative;padding:40px 16px 40px;max-width:520px;width:100%;margin:0 auto}
  .moon{position:absolute;top:20px;right:16px;width:56px;height:56px}
  .bat{position:absolute}
  .icon{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;margin-bottom:24px;font-size:17px}
  .raised{border-top:2px solid var(--light);border-left:2px solid var(--light);border-right:2px solid var(--dark);border-bottom:2px solid var(--dark)}
  .sunken{border-top:2px solid var(--dark);border-left:2px solid var(--dark);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
  .window{background:var(--window);padding:3px;box-shadow:0 0 0 1px #000,6px 6px 0 var(--dots);position:relative}
  .titlebar{background:var(--titlebar);padding:4px 4px 4px 8px;display:flex;align-items:center;justify-content:space-between}
  .titlebar span{font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:15px;color:#fff;display:flex;align-items:center;gap:6px}
  .tb-btns{display:flex;gap:3px}
  .tb-btns button{width:22px;height:20px;padding:0;background:var(--window);color:var(--text);font-family:'VT323',monospace;font-size:18px;line-height:1;cursor:pointer}
  .menu{display:flex;gap:18px;padding:4px 8px;font-size:19px;color:var(--muted)}
  .panel{margin:0 4px;background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:18px}
  .profile{display:flex;gap:18px;align-items:center}
  .pic{width:104px;height:104px;flex-shrink:0;border:2px solid var(--titlebar);outline:1px solid #000;outline-offset:2px;object-fit:cover;background:var(--desktop)}
  h1{margin:0;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:30px;color:#fff;line-height:1.05}
  p{margin:0}
  .sub{font-size:20px;color:var(--muted)}
  .status{font-size:20px;color:var(--accent)}
  .divider{display:flex;align-items:center;gap:10px}
  .divider i{flex:1;height:0;border-top:1px solid #000;border-bottom:1px solid var(--line)}
  .bio{font-size:21px;line-height:1.25}
  fieldset{margin:0;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
  legend{padding:0 6px;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:16px;color:var(--muted)}
  .link{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;background:var(--window);font-size:23px;color:var(--text);text-decoration:none}
  .link:hover{color:#ffa6e0;background:var(--dots)}
  .link:active{border-top-color:var(--dark);border-left-color:var(--dark);border-right-color:var(--light);border-bottom-color:var(--light)}
  .link span{flex:1}
  .link small{font-size:18px;color:var(--accent)}
  .statusbar{display:flex;gap:3px;padding:4px;font-size:17px;color:var(--muted)}
  .statusbar span{padding:1px 6px;border-top:1px solid #000;border-left:1px solid #000;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .statusbar span:first-child{flex:1}
  .taskbar{height:40px;background:var(--window);border-top:2px solid var(--light);padding:4px 6px;display:flex;align-items:center;justify-content:flex-end}
  .clock{height:28px;display:flex;align-items:center;padding:0 10px;font-size:19px;border-top:1px solid #000;border-left:1px solid #000;border-right:1px solid var(--light);border-bottom:1px solid var(--light)}
  @media (max-width:420px){ .profile{flex-direction:column;align-items:flex-start} .panel{padding:16px} }
</style>
</head>
<body>

<div class="desktop">

  <div class="window raised">
    <div class="titlebar">
      <span><svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M5 0h2v4h5v2H7v8H5V6H0V4h5z" fill="#fff"/></svg>about_me.exe</span>
      <div class="tb-btns">
        <button class="raised" aria-label="Minimise">_</button>
        <button class="raised" aria-label="Maximise">□</button>
        <button class="raised" aria-label="Close">×</button>

    <div class="panel sunken">
      <div class="profile">
        <!-- ===== YOUR PICTURE: upload pfp.png to Neocities next to this file ===== -->
        <img class="pic" src="pfp.png" alt="Profile picture">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h1>Cai</h1>
          <p class="sub">Any · UK</p>
          <p class="status" id="status">&gt; status: awake after midnight_</p>
        </div>
      </div>

      <div class="divider"><i></i><svg width="10" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M5 0h2v4h5v2H7v8H5V6H0V4h5z" fill="#e58ad6"/></svg><i></i></div>

      <p class="bio">Developer of many random things.</p>

      <fieldset class="sunken">
        <legend>Links</legend>
        <!-- ===== YOUR LINKS: replace each # with your URL ===== -->
        <a class="link raised" href="https://steamcommunity.com/id/Caii26/" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 6l4 6 5-4-2 10H5L3 8l5 4z"/></svg>
          <span>Steam</span><small>enter †</small>

        <a class="link raised" href="https://discord.com/users/239824816734076928" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
          <span>Discord</span><small>enter †</small>
        </a>
        <a class="link raised" href="https://github.com/Caii26" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>

    <div class="statusbar"><span>3 soul(s) bound</span><span>† est. 2026</span></div>
  </div>
</div>

<div class="taskbar"><div class="clock">09:99</div></div>

<script>
  /* ===== STATUS CHANGES WITH THE TIME OF DAY (UK time) ===== */
  (function(){
    var statuses = [
      [0,  "awake after midnight"],
      [5,  "still hasn't slept"],
      [9,  "running on zero sleep"],
      [12, "napping with the curtains shut"],
      [17, "finally waking up"],
      [21, "the night shift begins"]
    ];
    function update(){
      var h;
      try {
        h = parseInt(new Intl.DateTimeFormat("en-GB",{hour:"numeric",hourCycle:"h23",timeZone:"Europe/London"}).format(new Date()),10);
      } catch(e){ h = new Date().getHours(); }
      var text = statuses[0][1];
      for (var i=0;i<statuses.length;i++){ if (h >= statuses[i][0]) text = statuses[i][1]; }
      document.getElementById("status").textContent = "> status: " + text + "_";
    }
    update(); setInterval(update, 60000);
  })();
</script>
</body>
</html>
